<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>奶蛙拳皇</title>
  <style>
    :root{
      color-scheme:light dark;
      --ink:#172137;--muted:#5e6880;--paper:#f5f7fb;--panel:#ffffff;--line:#d6deeb;
      --yellow:#ffd229;--yellow2:#ffae17;--red:#ef3e4a;--blue:#1683d8;--cyan:#71dce6;
      --arena:#bfecff;--arena-deep:#69b6e8;--floor:#2f425b;--floor2:#172438;
      --shadow:0 18px 50px rgba(20,35,60,.16);
    }
    @media(prefers-color-scheme:dark){:root{
      --ink:#f6f8ff;--muted:#aab7d0;--paper:#0b1120;--panel:#151d2d;--line:#2e3a50;
      --arena:#234d70;--arena-deep:#132a47;--floor:#1c2b40;--floor2:#09111f;
      --shadow:0 18px 55px rgba(0,0,0,.4);
    }}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;overscroll-behavior:none}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
    .screen{min-height:100dvh}
    .hidden{display:none!important}

    /* Character select */
    #selectScreen{padding:clamp(18px,4vw,42px) max(18px,calc((100vw - 1120px)/2));background:
      radial-gradient(circle at 75% 8%,rgba(255,210,41,.28),transparent 28%),
      linear-gradient(180deg,var(--paper),color-mix(in srgb,var(--paper) 88%,var(--cyan)))}
    .select-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:0 0 24px}
    .select-head h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",sans-serif;font-size:clamp(34px,7vw,74px);line-height:.96;margin:4px 0 12px;letter-spacing:-.04em;max-width:720px}
    .select-head p{margin:0;color:var(--muted);font-size:clamp(14px,2vw,18px)}
    .laugh-preview{width:100px;height:133px;background:url('assets/laugh-preview.webp') 0 50%/2000% 100% no-repeat;animation:laughFrames 1.35s steps(19) infinite;filter:drop-shadow(0 10px 10px rgba(0,0,0,.16))}
    @keyframes laughFrames{to{background-position:100% 50%}}
    .select-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;align-items:start}
    .roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .char-card{position:relative;min-width:0;height:190px;padding:0;border:2px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;cursor:pointer;text-align:left;box-shadow:0 4px 0 color-mix(in srgb,var(--line) 75%,transparent);transition:transform .16s,border-color .16s,box-shadow .16s}
    .char-card:hover{transform:translateY(-3px)}
    .char-card.selected{border-color:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 20%,transparent),0 8px 0 color-mix(in srgb,var(--red) 70%,#7d171f)}
    .char-card img{position:absolute;inset:9px 8px 44px;width:calc(100% - 16px);height:calc(100% - 53px);object-fit:contain;filter:drop-shadow(0 10px 7px rgba(0,0,0,.16));transition:transform .18s}
    .char-card:hover img,.char-card.selected img{transform:translateY(-4px) rotate(-2deg) scale(1.05)}
    .char-card .name{position:absolute;bottom:9px;left:12px;right:10px;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .char-card .type{position:absolute;top:9px;right:9px;font-size:10px;font-weight:900;padding:3px 6px;border-radius:6px;background:var(--ink);color:var(--paper)}
    .pick-panel{position:sticky;top:18px;border:2px solid var(--ink);border-radius:22px;background:var(--panel);box-shadow:10px 10px 0 var(--ink);overflow:hidden}
    .pick-visual{height:238px;position:relative;background:linear-gradient(150deg,var(--yellow),#ffe987 58%,#fff4c6);overflow:hidden}
    .pick-visual:after{content:"";position:absolute;width:180px;height:180px;border:22px solid rgba(255,255,255,.4);border-radius:50%;right:-50px;top:-55px}
    .pick-visual img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;filter:drop-shadow(0 16px 12px rgba(103,68,0,.22))}
    .pick-body{padding:18px}
    .pick-body h2{margin:0 0 3px;font-size:26px}.pick-body p{margin:0;color:var(--muted);font-size:13px}
    .stat{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:700}
    .stat-line{height:7px;border-radius:2px;background:var(--line);overflow:hidden}.stat-line i{display:block;height:100%;background:var(--red)}
    .start-btn{width:100%;margin-top:16px;padding:14px 18px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #a51d2a;transform:translateY(-2px)}
    .start-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a51d2a}
    .key-help{font-size:11px!important;margin-top:14px!important;line-height:1.6}
    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 6px;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--line) 60%,transparent)}
    .mode-btn{border:0;border-radius:9px;padding:9px 6px;background:transparent;color:var(--muted);font-size:13px;font-weight:900;cursor:pointer}
    .mode-btn.active{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 60%,transparent)}
    .online-panel{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 88%,var(--cyan))}
    .online-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .online-actions button,.join-row button,.copy-code{border:0;border-radius:9px;padding:9px 8px;background:var(--blue);color:#fff;font-size:12px;font-weight:900;cursor:pointer}
    .join-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:8px}
    .join-row input{min-width:0;border:2px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);color:var(--ink);font:700 16px/1 "Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.18em;text-align:center;text-transform:uppercase}
    .invite-box{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding:9px 10px;border:2px dashed var(--blue);border-radius:10px;background:var(--panel)}
    .invite-code{font:900 22px/1 "Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.16em;color:var(--blue)}
    .copy-code{padding:7px 9px;background:var(--ink)}
    .net-status{margin:9px 0 0!important;color:var(--muted)!important;font-size:11px!important;line-height:1.45}
    .start-btn:disabled{cursor:not-allowed;filter:grayscale(.35);opacity:.58;box-shadow:0 3px 0 #7f2931;transform:none}

    /* Battle */
    #battleScreen{min-height:100dvh;background:#050914;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;overflow:hidden;touch-action:none}
    .game-shell{width:min(1100px,100%);margin:auto}
    .arena{position:relative;height:min(62vw,610px);min-height:360px;max-height:64dvh;overflow:hidden;border:2px solid #263247;border-radius:20px;background:linear-gradient(var(--arena),var(--arena-deep) 70%);box-shadow:0 20px 70px #000}
    .sun{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffe36c;left:12%;top:16%;box-shadow:0 0 0 14px rgba(255,227,108,.18),0 0 50px rgba(255,227,108,.7)}
    .cloud{position:absolute;width:170px;height:32px;border-radius:50%;background:rgba(255,255,255,.62);top:23%;right:14%;filter:blur(1px);box-shadow:-52px 9px 0 -7px rgba(255,255,255,.55),49px 5px 0 -10px rgba(255,255,255,.55)}
    .sky-lines{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 46px,rgba(255,255,255,.06) 47px 49px)}
    .city{position:absolute;left:0;right:0;bottom:30%;height:32%;opacity:.62;background:
      linear-gradient(to top,rgba(16,40,66,.76),rgba(16,40,66,.76)) 0 100%/100% 22% no-repeat,
      linear-gradient(90deg,transparent 2%,#1f4e72 2% 9%,transparent 9% 12%,#255b7f 12% 20%,transparent 20% 24%,#1f4e72 24% 32%,transparent 32% 35%,#183f62 35% 43%,transparent 43% 48%,#255b7f 48% 58%,transparent 58% 63%,#1a496f 63% 70%,transparent 70% 74%,#24597c 74% 84%,transparent 84% 88%,#194669 88% 98%,transparent 98%)}
    .stage-floor{position:absolute;left:-5%;right:-5%;bottom:-2%;height:34%;background:
      repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,255,255,.07) 79px 81px),
      linear-gradient(170deg,var(--floor),var(--floor2));transform:perspective(300px) rotateX(10deg);border-top:5px solid rgba(255,255,255,.25)}
    .floor-line{position:absolute;left:5%;right:5%;bottom:11%;height:3px;background:linear-gradient(90deg,transparent,#efc23b 15% 85%,transparent);opacity:.8}
    .hud{position:absolute;z-index:30;left:16px;right:16px;top:14px;display:grid;grid-template-columns:1fr 74px 1fr;gap:12px;align-items:start}
    .hud-player{min-width:0}.hud-player.cpu{text-align:right}
    .hud-name{font-size:13px;font-weight:900;color:#fff;text-shadow:0 2px 3px #000;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hp-track{height:18px;border:3px solid #fff;background:#281621;box-shadow:0 3px 0 #08101b;overflow:hidden;transform:skew(-10deg)}
    .cpu .hp-track{transform:skew(10deg)}
    .hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#54da5d,#b9ed57);transform-origin:left;transition:width .16s}
    .cpu .hp-fill{transform-origin:right;background:linear-gradient(90deg,#b9ed57,#54da5d)}
    .energy-track{height:7px;margin-top:5px;background:#09111c;border:1px solid rgba(255,255,255,.55);overflow:hidden}.energy-fill{height:100%;width:0;background:linear-gradient(90deg,#22b9ff,#b6f9ff);transition:width .18s}.cpu .energy-fill{margin-left:auto}
    .timer{font-family:"STKaiti","KaiTi","Microsoft YaHei",sans-serif;color:#fff;font-size:38px;line-height:1;text-align:center;text-shadow:0 3px 0 #000;background:#e33142;border:3px solid #fff;padding:4px;border-radius:8px;box-shadow:0 4px 0 #0c1525}
    .pause-btn{position:absolute;z-index:45;right:10px;top:88px;width:38px;height:34px;border:1px solid rgba(255,255,255,.5);border-radius:8px;background:rgba(8,15,27,.72);color:#fff;font-weight:900;cursor:pointer}
    .fighter{--stepY:8px;--stepRot:3deg;--stretch:1.04;position:absolute;z-index:10;width:clamp(104px,20vw,220px);height:clamp(142px,27vw,294px);bottom:20%;left:20%;transform:translateX(-50%);pointer-events:none}
    .sprite-shell{position:absolute;inset:0;transform-origin:50% 86%;overflow:visible}
    .sprite,.motion-echo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transform-origin:50% 86%;will-change:transform,filter,opacity}
    .sprite{z-index:3;filter:drop-shadow(0 18px 8px rgba(0,0,0,.3))}
    .motion-echo{z-index:1;opacity:0;filter:sepia(1) saturate(5) hue-rotate(325deg) brightness(1.2);mix-blend-mode:screen}
    .fighter.state-idle .sprite{animation:idleBreath 1.15s ease-in-out infinite alternate}
    .fighter.state-move .sprite{animation:walkCycle .22s cubic-bezier(.35,0,.65,1) infinite}
    .fighter.state-move:after{content:"";position:absolute;z-index:0;left:31%;bottom:0;width:36%;height:10%;border-radius:50%;background:radial-gradient(ellipse,rgba(245,235,195,.8),transparent 66%);animation:stepDust .44s steps(2,end) infinite}
    .fighter.state-jump .sprite{animation:jumpPose .55s ease-out}
    .fighter.state-guard .sprite{animation:guardPulse .26s ease-in-out infinite alternate;filter:drop-shadow(0 18px 8px rgba(0,0,0,.28)) drop-shadow(0 0 12px #64e6ff)}
    .fighter.state-hit .sprite{filter:brightness(1.7) saturate(.25) drop-shadow(0 0 10px #fff)}
    .fighter.state-ko .sprite{filter:grayscale(.45) brightness(.78) drop-shadow(0 14px 7px rgba(0,0,0,.3))}
    .fighter.state-light .motion-echo,.fighter.state-heavy .motion-echo,.fighter.state-special .motion-echo,.fighter.state-hit .motion-echo{opacity:.32;animation:echoTrail .34s ease-out forwards}
    .fighter.state-heavy .echo-b,.fighter.state-special .echo-b{animation-delay:.055s;opacity:.2}
    .attack-arc{display:none}
    .fighter.state-light .attack-arc{border-top-color:#fff6a8;animation:attackArc .31s ease-out}
    .fighter.state-heavy .attack-arc{width:78%;height:46%;border-top-color:#ff814a;border-width:12px;animation:attackArc .5s ease-out}
    .fighter.state-special .attack-arc{inset:18% 2% auto 2%;width:96%;height:70%;border:9px solid var(--yellow);animation:specialArc .72s ease-out}
    @keyframes idleBreath{from{transform:translateY(1px) rotate(-.7deg) scale(.995)}to{transform:translateY(-4px) rotate(.7deg) scale(1.015)}}
    @keyframes walkCycle{0%{transform:translateY(1px) rotate(calc(var(--stepRot)*-.8)) scale(.99)}25%{transform:translateY(calc(var(--stepY)*-1)) rotate(0) scale(1.025)}50%{transform:translateY(0) rotate(calc(var(--stepRot)*.8)) scale(.99)}75%{transform:translateY(calc(var(--stepY)*-1)) rotate(0) scale(1.025)}100%{transform:translateY(1px) rotate(calc(var(--stepRot)*-.8)) scale(.99)}}
    @keyframes stepDust{0%,49%{transform:translateX(-18%) scale(.45);opacity:.8}50%,100%{transform:translateX(18%) scale(1);opacity:.15}}
    @keyframes echoTrail{0%{transform:translateX(-3px) scale(.98);opacity:.42}100%{transform:translateX(-30px) scale(1.07);opacity:0}}
    @keyframes attackArc{0%{transform:rotate(-55deg) scale(.2);opacity:0}30%{opacity:1}100%{transform:rotate(52deg) scale(1.15);opacity:0}}
    @keyframes specialArc{0%{transform:rotate(-24deg) scale(.15);opacity:0}25%{opacity:1}100%{transform:rotate(165deg) scale(1.25);opacity:0}}
    @keyframes jumpPose{0%{transform:translateY(4px) rotate(calc(var(--stepRot)*-1)) scale(.95)}45%{transform:translateY(-8px) rotate(calc(var(--stepRot)*2)) scale(1.055)}100%{transform:scale(1)}}
    @keyframes guardPulse{from{transform:translateX(4px) rotate(-5deg) scale(.98)}to{transform:translateX(0) rotate(-2deg) scale(1.02)}}
    .fighter-shadow{position:absolute;left:17%;right:17%;height:9%;bottom:-2%;border-radius:50%;background:rgba(0,0,0,.36);filter:blur(4px);transition:transform .2s,opacity .2s}
    .fighter.jumping .fighter-shadow{transform:scale(.56);opacity:.45}
    .laugh-sprite{display:none;position:absolute;left:50%;bottom:0;translate:-50% 0;width:min(100%,144px);aspect-ratio:3/4;background:url('assets/laugh-sprite.webp') 0 0/2000% 100% no-repeat;filter:drop-shadow(0 16px 8px rgba(0,0,0,.3))}
    .fighter.state-victory .sprite{display:none}.fighter.state-victory .laugh-sprite{display:block;animation:laughFrames .95s steps(19) infinite}
    .fighter.state-victory{z-index:25;animation:victoryBounce 1s ease-in-out infinite alternate}
    @keyframes victoryBounce{to{transform:translateX(-50%) translateY(-6px)}}
    .impact{position:absolute;z-index:28;width:72px;height:72px;transform:translate(-50%,-50%);pointer-events:none}
    .impact:before,.impact:after{content:"";position:absolute;inset:16px;background:#fff;border:8px solid var(--yellow);transform:rotate(45deg);animation:impactPop .38s ease-out forwards}.impact:after{inset:2px;border:3px solid #fff;background:transparent}
    @keyframes impactPop{from{transform:rotate(45deg) scale(.15);opacity:1}to{transform:rotate(105deg) scale(1.2);opacity:0}}
    .damage-text{position:absolute;z-index:35;color:#fff;font-weight:900;font-size:22px;text-shadow:2px 2px 0 #c51e2c,-1px -1px 0 #c51e2c;animation:floatDmg .7s ease-out forwards;pointer-events:none}
    @keyframes floatDmg{to{transform:translateY(-65px) rotate(-8deg);opacity:0}}
    .particle{position:absolute;z-index:27;width:10px;height:10px;border-radius:50%;background:var(--yellow);pointer-events:none;animation:particleFly .55s ease-out forwards}
    @keyframes particleFly{to{transform:translate(var(--dx),var(--dy)) rotate(160deg) scale(.2);opacity:0}}
    .callout{position:absolute;z-index:50;inset:0;display:grid;place-items:center;pointer-events:none;font-family:"STKaiti","KaiTi","Microsoft YaHei",sans-serif;color:#fff;font-size:clamp(52px,12vw,110px);text-shadow:0 7px 0 #121b2b,0 0 20px rgba(0,0,0,.5);transform:rotate(-4deg)}
    .callout.pop{animation:callout .7s ease both}@keyframes callout{0%{opacity:0;transform:scale(2) rotate(-8deg)}35%{opacity:1;transform:scale(.93) rotate(-4deg)}100%{opacity:0;transform:scale(1.1) rotate(-2deg)}}
    .special-banner{position:absolute;z-index:40;left:0;right:0;top:46%;padding:8px;text-align:center;background:rgba(7,17,31,.84);border-block:3px solid var(--yellow);color:var(--yellow);font:clamp(22px,5vw,45px)/1 "STKaiti","KaiTi","Microsoft YaHei",sans-serif;letter-spacing:.08em;animation:banner .65s ease both;pointer-events:none}@keyframes banner{0%{transform:scaleX(0)}25%{transform:scaleX(1)}75%{opacity:1}100%{opacity:0}}

    .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;align-items:center}
    .move-controls,.attack-controls{display:flex;gap:10px;align-items:center}.attack-controls{justify-content:flex-end}
    .control-btn{border:2px solid #738199;background:#1b2639;color:#fff;box-shadow:0 5px 0 #060b14;border-radius:50%;width:clamp(58px,13vw,76px);height:clamp(58px,13vw,76px);font-size:18px;font-weight:900;touch-action:none;user-select:none;cursor:pointer}
    .control-btn:active,.control-btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 #060b14;background:#2c3c56}
    .control-btn.light{background:#298ed3}.control-btn.heavy{background:#e14945}.control-btn.special{background:#e4ad17;color:#172137;font-size:14px}.control-btn.guard{width:54px;height:54px;font-size:12px;background:#4a5a73}.control-btn.jump{font-size:25px}
    .control-label{display:block;font-size:10px;font-weight:700;opacity:.7;margin-top:2px}
    .desktop-tip{text-align:center;color:#76839b;font-size:11px;margin:9px 0 0}

    .pause-overlay,.end-overlay{position:absolute;z-index:80;inset:0;display:grid;place-items:center;background:rgba(4,8,16,.74);backdrop-filter:blur(5px)}
    .modal{width:min(420px,calc(100% - 32px));padding:26px;border:2px solid #fff;border-radius:20px;background:#101a2b;color:#fff;text-align:center;box-shadow:10px 10px 0 rgba(0,0,0,.55)}
    .modal h2{font-family:"STKaiti","KaiTi","Microsoft YaHei",sans-serif;font-size:42px;margin:0 0 8px}.modal p{color:#b8c4d9;margin:0 0 20px}
    .modal-actions{display:flex;gap:10px}.modal-actions button{flex:1;border:0;border-radius:10px;padding:13px 10px;font-weight:900;cursor:pointer;background:#e43a49;color:#fff}.modal-actions .secondary{background:#344157}

    @media(max-width:760px){
      .select-head{position:relative;grid-template-columns:1fr}.laugh-preview{position:absolute;right:4px;top:0;width:78px;height:104px}.select-head h1{padding-right:92px}.select-layout{grid-template-columns:1fr}.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.char-card{height:168px}.pick-panel{position:static;box-shadow:6px 6px 0 var(--ink);display:grid;grid-template-columns:42% 58%}.pick-visual{height:auto;min-height:235px}.pick-body{padding:16px}.key-help{display:none}
      .arena{height:clamp(348px,55dvh,520px);min-height:348px;max-height:520px}.hud{left:8px;right:8px;top:8px;grid-template-columns:1fr 54px 1fr;gap:6px}.timer{font-size:29px}.hp-track{height:15px}.pause-btn{top:67px}.fighter{width:clamp(104px,30vw,158px);height:clamp(142px,39vw,215px);bottom:19%}.controls{gap:8px}.move-controls,.attack-controls{gap:6px}.control-btn{width:clamp(55px,16vw,68px);height:clamp(55px,16vw,68px)}.control-btn.guard{width:49px;height:49px}.desktop-tip{display:none}
    }
    @media(max-width:430px){.pick-panel{display:block}.pick-visual{height:210px}.arena{border-radius:14px;min-height:345px}.controls{margin-top:8px}.move-controls{display:grid;grid-template-columns:repeat(3,1fr)}.attack-controls{display:grid;grid-template-columns:repeat(2,1fr)}.control-btn.special{grid-column:2}.control-btn{width:58px;height:58px}.attack-controls .control-btn{justify-self:end}.hud-name{font-size:11px}}
    @media(prefers-reduced-motion:reduce){.laugh-preview,.char-card img,.fighter.state-victory,.laugh-sprite{animation-duration:2.4s!important}.particle,.impact,.damage-text{animation-duration:.9s!important}}
  
    /* Full-body model sheets: eight generated fighting poses per character in a 4 × 2 grid. */
    .fighter{height:clamp(104px,20vw,220px)}
    .sprite{background-repeat:no-repeat;background-size:400% 200%;background-position:0 0;animation:none!important;image-rendering:auto;filter:drop-shadow(0 18px 8px rgba(0,0,0,.3))}
    .fighter.state-idle .sprite,.fighter.state-walk .sprite,.fighter.state-lp .sprite,.fighter.state-hp .sprite,.fighter.state-lk .sprite,.fighter.state-hk .sprite,.fighter.state-upper .sprite,.fighter.state-crouch .sprite,.fighter.state-jumpatk .sprite,.fighter.state-special .sprite,.fighter.state-hit .sprite,.fighter.state-ko .sprite,.fighter.state-guard .sprite{animation:none!important}
    .fighter.state-guard .sprite{filter:drop-shadow(0 18px 8px rgba(0,0,0,.28)) drop-shadow(0 0 12px #64e6ff)}
    .fighter.state-hit .sprite{filter:brightness(1.55) saturate(.55) drop-shadow(0 0 9px #fff)}

<body>

            <div class="invite-box hidden" id="inviteBox"><span class="invite-code" id="inviteCode"></span><button class="copy-code" id="copyCode" type="button">复制</button></div>

          <div class="stat"><span>速度</span><div class="stat-line"><i id="speedStat"></i></div></div>
          <div class="stat"><span>体力</span><div class="stat-line"><i id="hpStat"></i></div></div>

          <button class="start-btn" id="startBtn">带它上场</button>

        </div>
      </aside>
    </div>
  </main>

        <div class="sun"></div><div class="cloud"></div><div class="sky-lines"></div><div class="city"></div><div class="stage-floor"></div><div class="floor-line"></div>
        <div class="hud">
          <div class="hud-player"><div class="hud-name" id="pName"></div><div class="hp-track"><div class="hp-fill" id="pHp"></div></div><div class="energy-track"><div class="energy-fill" id="pEnergy"></div></div></div>
          <div class="timer" id="timer">60</div>
          <div class="hud-player cpu"><div class="hud-name" id="cName"></div><div class="hp-track"><div class="hp-fill" id="cHp"></div></div><div class="energy-track"><div class="energy-fill" id="cEnergy"></div></div></div>
        </div>
        <button class="pause-btn" id="pauseBtn" aria-label="暂停">Ⅱ</button>
        <div class="fighter" id="playerFighter"><div class="fighter-shadow"></div><div class="sprite-shell"><div class="sprite" role="img" aria-label="玩家奶蛙全身模型逐帧动作"></div><i class="attack-arc"></i><div class="laugh-sprite"></div></div></div>
        <div class="fighter" id="cpuFighter"><div class="fighter-shadow"></div><div class="sprite-shell"><div class="sprite" role="img" aria-label="电脑奶蛙全身模型逐帧动作"></div><i class="attack-arc"></i><div class="laugh-sprite"></div></div></div>
        <div class="callout" id="callout"></div>
        <div class="pause-overlay hidden" id="pauseOverlay"><div class="modal"><h2>暂停</h2><p>奶蛙正在喘口气</p><div class="modal-actions"><button id="resumeBtn">继续对战</button><button id="quitBtn" class="secondary">重选角色</button></div></div></div>
        <div class="end-overlay hidden" id="endOverlay"><div class="modal"><h2 id="endTitle"></h2><p id="endText"></p><div class="modal-actions"><button id="rematchBtn">再来一局</button><button id="changeBtn" class="secondary">重选角色</button></div></div></div>
      </section>
      <section class="controls" aria-label="格斗控制器">
        <div class="move-controls">
          <button class="control-btn" data-hold="left" aria-label="向左">◀</button>
          <button class="control-btn jump" data-action="jump" aria-label="跳跃">跳</button>
          <button class="control-btn" data-hold="right" aria-label="向右">▶</button>
          <button class="control-btn crouch" data-hold="down" aria-label="下蹲">蹲</button>
          <button class="control-btn upper" data-action="upper" aria-label="上勾拳">升<span class="control-label">对空</span></button>
          <button class="control-btn guard" data-hold="guard">防<span class="control-label">格挡</span></button>
        </div>
        <div class="attack-controls">
          <button class="control-btn light" data-action="lp">轻拳</button>
          <button class="control-btn heavy" data-action="hp">重拳</button>
          <button class="control-btn light kick" data-action="lk">轻脚</button>
          <button class="control-btn heavy kick" data-action="hk">重脚</button>
          <button class="control-btn special" data-action="special">齁齁齁<span class="control-label">专属必杀</span></button>
        </div>
      </section>
      <p class="desktop-tip">A/D 移动　S 蹲　W 跳　J/K 拳　N/M 脚　U 升龙　L 必杀　I 防御</p>
    </div>
  </main>

  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
  <audio id="sfx1" src="assets/sfx1.mp3" preload="auto"></audio>

  <audio id="sfx4" src="assets/sfx4.mp3" preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>
<script>
(function(){
  'use strict';
  const fighters=[
    {key:'classic',name:'经典奶蛙',type:'均衡',desc:'拳脚扎实，远近都能打',hp:104,power:14.4,speed:12.2,defense:1.00,skill:'捧腹震波',special:'wave',fx:'rings'},
    {key:'bounce',name:'蹦蹦蛙',type:'空战',desc:'跳得高，空中追击快',hp:96,power:13.0,speed:15.0,defense:.96,skill:'冲天齁叫',special:'leap',fx:'stars'},
    {key:'angry',name:'生气蛙',type:'重击',desc:'慢半拍，但一拳很疼',hp:106,power:16.4,speed:9.5,defense:1.04,skill:'怒蛙震地',special:'rage',fx:'sparks'},
    {key:'tea',name:'奶茶蛙',type:'飞道',desc:'奶茶杯封路，擅长控场',hp:100,power:13.7,speed:11.4,defense:1.00,skill:'全糖飞杯',special:'cup',fx:'bubbles'},
    {key:'lolita',name:'洛丽塔蛙',type:'连击',desc:'轻快四连，收招灵活',hp:95,power:12.7,speed:15.5,defense:.95,skill:'甜心回旋',special:'ribbon',fx:'hearts'},
    {key:'cat',name:'喵喵蛙',type:'位移',desc:'闪身绕背，出招难猜',hp:97,power:13.4,speed:14.8,defense:.97,skill:'猫步瞬袭',special:'blink',fx:'slashes'},
    {key:'worker',name:'打工奶龙',type:'力量',desc:'公文包很重，动作也很重',hp:112,power:16.0,speed:8.8,defense:1.10,skill:'下班重砸',special:'case',fx:'papers'},
    {key:'beauty',name:'美人蛙',type:'技巧',desc:'水花魅影牵制，步伐飘逸',hp:99,power:13.6,speed:13.8,defense:.98,skill:'碧波魅影',special:'splash',fx:'water'}
  ];
  const poseFrames={
    idle:[0,0,0,0,0,0,0,0],guard:[0,0,0,0,0,0,0,0],walk:[0,1,0,1,0,1,0,1],
    lp:[0,2,2,2,2,2,0,0],hp:[0,1,2,3,3,3,2,0],
    lk:[0,4,4,4,4,4,0,0],hk:[0,1,4,5,5,5,4,0],
    upper:[0,2,3,3,3,2,0,0],crouch:[0,4,4,0,0,0,0,0],jumpatk:[1,4,5,5,4,1,0,0],
    special:[0,1,6,6,6,6,1,0],hit:[0,7,7,7,7,0,0,0],ko:[0,7,7,7,7,7,7,7]
  };
  const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
  const roster=$('#roster'),selectScreen=$('#selectScreen'),battleScreen=$('#battleScreen'),arena=$('#arena');
  const bgm=$('#bgm'); bgm.volume=.22;
  let selected=0,player=null,cpu=null,running=false,paused=false,last=0,raf=0,timeLeft=60,timerId=0,aiId=0,sim=0,events=[],matchToken=0,pauseAt=0;
  const held={left:false,right:false,down:false,guard:false},remoteHeld={left:false,right:false,down:false,guard:false};
  let gameMode='solo',mqttClient=null,roomTopic='',netRole=null,remoteSelected=0,netReady=false,lastNetSync=0,guestRaf=0,peerSeen=false;
  const mqttBroker='wss://broker.emqx.io:8084/mqtt';
  const netId='nf-'+Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);

  function renderRoster(){
    roster.innerHTML='';
    fighters.forEach((f,i)=>{const b=document.createElement('button');b.className='char-card'+(i===selected?' selected':'');b.dataset.index=i;b.innerHTML='<img src="assets/char-'+f.key+'.webp" alt="'+f.name+'角色立绘"><span class="type">'+f.type+'</span><span class="name">'+f.name+'</span>';b.addEventListener('click',()=>pick(i));roster.appendChild(b)});
    updatePick();
  }
  function pick(i){selected=i;$$('.char-card').forEach((b,n)=>b.classList.toggle('selected',n===i));updatePick();playSound('sfx'+((i%4)+1),.2);netSend({type:'select',index:i})}
  function updatePick(){const f=fighters[selected];$('#pickImage').src='assets/char-'+f.key+'.webp';$('#pickName').textContent=f.name;$('#pickDesc').textContent=f.desc;$('#powerStat').style.width=Math.round(f.power/17*100)+'%';$('#speedStat').style.width=Math.round(f.speed/16*100)+'%';$('#hpStat').style.width=Math.round(f.hp/114*100)+'%';$('#defStat').style.width=Math.round(f.defense/1.12*100)+'%'}
  function playSound(id,vol){const a=document.getElementById(id);if(!a)return;a.volume=vol||.35;a.currentTime=0;a.play().catch(()=>{})}
  function safeDelay(fn,ms,token){setTimeout(()=>{if(token===matchToken)fn()},ms)}
  function netSend(data){
    if(!mqttClient||!mqttClient.connected||!roomTopic)return;
    try{mqttClient.publish(roomTopic,JSON.stringify(Object.assign({sender:netId,role:netRole,sentAt:Date.now()},data)),{qos:0,retain:false})}catch(_){}
  }
  function setNetStatus(text,isError){const e=$('#netStatus');e.textContent=text;e.style.color=isError?'var(--red)':''}
  function refreshStartButton(){const b=$('#startBtn');if(gameMode==='solo'){b.disabled=false;b.textContent='带它上场';return}if(!netReady){b.disabled=true;b.textContent='等待联机';return}if(netRole==='host'){b.disabled=false;b.textContent='开始联机对战'}else{b.disabled=true;b.textContent='等待房主开战'}}
  function closeMqtt(){
    if(mqttClient){try{if(mqttClient.connected&&roomTopic)mqttClient.publish(roomTopic,JSON.stringify({sender:netId,role:netRole,type:'leave'}),{qos:0,retain:false});mqttClient.end(true)}catch(_){}}
    mqttClient=null;roomTopic='';peerSeen=false;
  }
  function resetNetwork(keepMode){
    netReady=false;netRole=null;remoteSelected=0;closeMqtt();
    $('#inviteBox').classList.add('hidden');$('#inviteCode').textContent='';$('#inviteInput').value='';setNetStatus('创建房间后，把 6 位数字邀请码发给朋友；双方保持页面打开即可对战。');if(!keepMode)setMode('solo');else refreshStartButton();
  }
  function setMode(mode){gameMode=mode;$('#soloMode').classList.toggle('active',mode==='solo');$('#onlineMode').classList.toggle('active',mode==='online');$('#onlinePanel').classList.toggle('hidden',mode!=='online');if(mode==='solo'&&mqttClient)resetNetwork(true);refreshStartButton()}
  function makeCode(){return String(Math.floor(100000+Math.random()*900000))}
  function connectMqtt(code,role){
    if(!window.mqtt||typeof window.mqtt.connect!=='function'){setNetStatus('MQTT 联机组件加载失败，请检查网络后刷新页面。',true);return}
    netRole=role;roomTopic='naiwa-fighter/room/'+code;peerSeen=false;
    const willPayload=JSON.stringify({sender:netId,role:role,type:'leave'});
    mqttClient=window.mqtt.connect(mqttBroker,{clientId:netId+'-'+Math.random().toString(16).slice(2,6),clean:true,keepalive:20,reconnectPeriod:2500,connectTimeout:10000,will:{topic:roomTopic,payload:willPayload,qos:0,retain:false}});
    mqttClient.on('connect',()=>{
      mqttClient.subscribe(roomTopic,{qos:0},err=>{
        if(err){setNetStatus('订阅房间失败，请断开后重试。',true);return}
        setNetStatus(role==='host'?'房间已创建，把邀请码发给朋友。':'已进入房间，正在等待房主确认…');
        netSend({type:'hello',index:selected});
        if(role==='host')netSend({type:'host-ready',index:selected});
      });
    });
    mqttClient.on('message',(topic,payload)=>{
      if(topic!==roomTopic)return;
      let data;try{data=JSON.parse(payload.toString())}catch(_){return}
      if(!data||data.sender===netId)return;handleNetData(data);
    });
    mqttClient.on('reconnect',()=>setNetStatus('网络波动，正在重新连接房间…'));
    mqttClient.on('offline',()=>{netReady=false;setNetStatus('MQTT 连接已断开，正在重连…',true);refreshStartButton()});
    mqttClient.on('error',()=>{netReady=false;setNetStatus('MQTT 联机失败，请检查网络或邀请码后重试。',true);refreshStartButton()});
  }
  function createOnlineRoom(){
    resetNetwork(true);const code=makeCode();$('#inviteCode').textContent=code;$('#inviteBox').classList.remove('hidden');setNetStatus('正在通过 MQTT 创建房间…');connectMqtt(code,'host');
  }
  function joinOnlineRoom(){
    const code=$('#inviteInput').value.trim().replace(/\D/g,'');if(code.length!==6){setNetStatus('请输入完整的 6 位数字邀请码。',true);return}
    resetNetwork(true);$('#inviteInput').value=code;setNetStatus('正在通过 MQTT 加入房间…');connectMqtt(code,'guest');
  }
  function handleNetData(data){
    if(!data||typeof data!=='object')return;

  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused&&netRole!=='guest')setPaused(true)});
  renderRoster();refreshStartButton();
})();
</script>
</body>
</html>
